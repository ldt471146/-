springdoc:
  paths-to-match: /api/**
  swagger-ui:
    operations-sorter: alpha

spring:
  application:
    name: back

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

  # ======================
  # 邮件配置
  # ======================
  mail:
    host: ${MAIL_HOST:smtp.163.com}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    port: 465
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

  # ======================
  # RabbitMQ
  # ======================
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000

  amqp:
    deserialization:
      trust:
        all: false

  # ======================
  # 数据源
  # ======================
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/online?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ======================
  # Redis（无密码）
  # ======================


  # ======================
  # 安全 / JWT
  # ======================
  security:
    jwt:
      key: ${JWT_KEY:change-me-local-dev-key}
      expire: 72
      remember-expire: 168
      limit:
        base: 10
        upgrade: 300
        frequency: 30
    filter:
      order: -100

  # ======================
  # Web 相关
  # ======================
  web:
    verify:
      mail-limit: 60
      code-expire: 600
    flow:
      period: 3
      limit: 50
      block: 30
    cors:
      origin: '*'
      credentials: false
      methods: '*'

  minio:
    endpoint: ${MINIO_ENDPOINT:http://192.168.109.129:9000}
    username: ${MINIO_USERNAME:minio}
    password: ${MINIO_PASSWORD:password}

  weather:
    key: ${WEATHER_KEY:}
    api-host: ${WEATHER_API_HOST:kv487n5dxd.re.qweatherapi.com}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ======================
# 本地判题配置
# ======================
local-judge:
  timeout-ms: 3000
  max-output-length: 20000
  # Windows 常见可改为: py / gcc / g++
  # Linux 常见可改为: python3 / gcc / g++
  python-command: python
  gcc-command: gcc
  gpp-command: g++

app:
  demo:
    seed-accounts: true
  upload:
    avatar-dir: ${APP_UPLOAD_AVATAR_DIR:data/uploads/avatars}
    avatar-url-prefix: /uploads/avatars/
    avatar-max-size: 2097152

