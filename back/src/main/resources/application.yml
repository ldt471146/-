springdoc:
  paths-to-match: /api/**
  swagger-ui:
    operations-sorter: alpha

spring:
  application:
    name: back

  # ======================
  # 邮件配置
  # ======================
  mail:
    host: smtp.163.com
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    port: 465
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

  # ======================
  # RabbitMQ
  # ======================
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000

  amqp:
    deserialization:
      trust:
        all: false

  # ======================
  # 数据源
  # ======================
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/online?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ======================
  # Redis（无密码）
  # ======================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}


  # ======================
  # 安全 / JWT
  # ======================
  security:
    jwt:
      key: ${JWT_KEY:please-change-this-jwt-key}
      expire: ${JWT_EXPIRE_HOURS:72}
      remember-expire: ${JWT_REMEMBER_EXPIRE_HOURS:168}
      limit:
        base: 10
        upgrade: 300
        frequency: 30
    filter:
      order: -100

  # ======================
  # Web 相关
  # ======================
  web:
    verify:
      mail-limit: 60
      code-expire: 600
    flow:
      period: 3
      limit: 50
      block: 30
    cors:
      origin: '*'
      credentials: false
      methods: '*'

  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    username: ${MINIO_USERNAME:minio}
    password: ${MINIO_PASSWORD:minio123}

  weather:
    key: ${WEATHER_KEY:}
    api-host: ${WEATHER_API_HOST:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ======================
# 本地判题配置
# ======================
local-judge:
  timeout-ms: 3000
  max-output-length: 20000
  # Windows 常见可改为: py / gcc / g++
  # Linux 常见可改为: python3 / gcc / g++
  python-command: python
  gcc-command: gcc
  gpp-command: g++

# ======================
# AI Assistant
# ======================
ai:
  base-url: ${AI_BASE_URL:https://yunwu.ai/v1}
  api-key: ${AI_API_KEY:}

  model: ${AI_MODEL:gpt-4o-mini}
  fallback-models:
    - gpt-4.1-mini
    - gpt-4o
